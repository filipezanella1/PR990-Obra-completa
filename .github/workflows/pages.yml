name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Conferir o motor de fórmulas com os valores da planilha
        run: npm test

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar a versão de arquivo único
        run: python3 tools/bundle.py
      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js icons drenagem pranchas memorias vendor src data dist .nojekyll _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" _site/sw.js _site/index.html _site/src/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
