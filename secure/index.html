<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2a3036">
<title>Acesso restrito</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { color-scheme: light dark; --bg: #f3f4f5; --card: #fff; --fg: #1d2226; --mut: #5f6870; --line: #d9dde1; --acc: #e2a20b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15191c; --card: #1d2226; --fg: #e6e9ec; --mut: #9aa4ad; --line: #343c43; --acc: #f0b429; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  main { width: min(420px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
  .sh { display: inline-block; background: var(--acc); color: #1d2226; font-weight: 700; padding: 1px 8px; border-radius: 3px; }
  h1 { font-size: 1.3rem; margin: 14px 0 6px; } p { color: var(--mut); margin: 0 0 18px; font-size: .95rem; }
  input { width: 100%; font: 600 1.05rem ui-monospace, Menlo, monospace; letter-spacing: .06em; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); text-transform: uppercase; }
  input:focus { outline: 2px solid var(--acc); border-color: var(--acc); }
  label.r { display: flex; gap: 8px; align-items: center; color: var(--mut); font-size: .9rem; margin: 12px 0 16px; }
  button { width: 100%; font: 700 1rem system-ui, sans-serif; padding: 12px; border: 0; border-radius: 8px; background: var(--acc); color: #1d2226; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  #msg { min-height: 1.4em; margin: 12px 0 0; font-size: .9rem; color: var(--mut); } #msg.err { color: #c23b3b; }
  small { display: block; margin-top: 18px; color: var(--mut); font-size: .78rem; }
</style>
</head>
<body>
<main>
  <span class="sh">PR-990</span>
  <h1>Acesso restrito</h1>
  <p>Todo o conteúdo deste painel é cifrado. Digite o seu código de acesso.</p>
  <form id="f" autocomplete="off">
    <input id="c" name="c" type="password" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="current-password" required aria-label="Código de acesso">
    <label class="r"><input type="checkbox" id="rem" checked style="width:auto"> Manter este aparelho liberado</label>
    <button id="b" type="submit">Entrar</button>
    <p id="msg" role="status"></p>
  </form>
  <small>Os dados são decifrados somente neste aparelho, depois do código correto.</small>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s); const msg = (t, e) => { $('#msg').textContent = t; $('#msg').className = e ? 'err' : ''; };
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const db = (mode, fn) => new Promise((ok, no) => { const r = indexedDB.open('pr990sec', 1); r.onupgradeneeded = () => r.result.createObjectStore('k');
    r.onerror = () => no(r.error); r.onsuccess = () => { const tx = r.result.transaction('k', mode); const q = fn(tx.objectStore('k')); tx.oncomplete = () => ok(q && q.result); tx.onerror = () => no(tx.error); }; });
  const go = () => location.replace('app.html' + (location.hash || '#painel'));
  async function sw() {
    if (!('serviceWorker' in navigator)) throw new Error('este navegador não suporta o modo protegido');
    await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }); await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) await new Promise(r => { navigator.serviceWorker.addEventListener('controllerchange', r, { once: true }); setTimeout(r, 4000); });
  }
  (async () => { try { const k = await db('readonly', s => s.get('dk')); if (k) { msg('Abrindo…'); await sw(); return go(); } } catch { } sw().catch(e => msg(e.message, true)); })();
  $('#f').addEventListener('submit', async ev => {
    ev.preventDefault(); const code = $('#c').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (code.length < 12) return msg('Código incompleto.', true);
    $('#b').disabled = true; msg('Verificando…');
    try {
      const K = await fetch('enc/k.json', { cache: 'no-store' }).then(r => r.json());
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
      let dk = null;
      for (const w of K.wraps) {
        try { const wk = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(w.salt), iterations: K.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
          const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(w.iv) }, wk, b64(w.ct));
          dk = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt', 'encrypt']); break; } catch { }
      }
      if (!dk) { $('#b').disabled = false; return msg('Código incorreto.', true); }
      await db('readwrite', s => s.put(dk, 'dk')); await db('readwrite', s => s.put(!!$('#rem').checked, 'keep'));
      try { sessionStorage.setItem('pr990sec', '1'); } catch { }
      msg('Liberado. Abrindo o painel…'); await sw(); go();
    } catch (e) { $('#b').disabled = false; msg('Não foi possível entrar: ' + e.message, true); }
  });
})();
</script>
</body>
</html>
